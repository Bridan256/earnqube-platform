<!DOCTYPE html>
<html>
<head>
  <title>Earnqube Admin Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      margin: 0;
    }

    header {
      background: #111;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    button {
      padding: 10px 15px;
      margin-bottom: 10px;
      cursor: pointer;
      background: #111;
      color: white;
      border: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #222;
      color: white;
    }

    .status {
      padding: 5px 8px;
      border-radius: 5px;
      color: white;
    }

    .pending { background: orange; }
    .success { background: green; }
    .failed { background: red; }
  </style>
</head>

<body>

<header>
  <h2>Earnqube Admin Dashboard</h2>
</header>

<div class="container">

  <button onclick="loadPayments()">🔄 Refresh Payments</button>
  <button onclick="logout()">🚪 Logout</button>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Provider</th>
        <th>Transaction ID</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="paymentsTable"></tbody>
  </table>

</div>

<script>
// CHECK LOGIN
const token = localStorage.getItem("token");
if (!token) {
  window.location.href = "/login.html";
}

// LOAD PAYMENTS
async function loadPayments() {
  const res = await fetch("/api/all", {
    headers: {
      Authorization: "Bearer " + token
    }
  });

  if (res.status === 401) {
    alert("Session expired. Please login again.");
    logout();
    return;
  }

  const data = await res.json();

  let html = "";

  data.forEach(p => {
    html += `
      <tr>
        <td>${p.name}</td>
        <td>${p.phone}</td>
        <td>${p.provider}</td>
        <td>${p.transactionId}</td>
        <td>
          <span class="status ${p.status}">
            ${p.status}
          </span>
        </td>
      </tr>
    `;
  });

  document.getElementById("paymentsTable").innerHTML = html;
}

// LOGOUT
function logout() {
  localStorage.removeItem("token");
  window.location.href = "/login.html";
}

// AUTO LOAD
loadPayments();
</script>

</body>
</html>
